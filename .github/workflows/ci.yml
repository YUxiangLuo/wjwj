name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, blocking gate on every push/PR. No browser, no redundant suites.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sampling_vlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sampling_vlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sampling_vlab_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sampling_vlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run verify
      - run: bun run test:db
      - run: bun run db:seed:demo
      - run: bun run db:seed:check

  # Non-blocking early signal: randomized order surfaces order-dependent tests
  # without being able to fail the PR gate.
  randomized:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Unit tests only need the variable to be present: the SQL client is
      # lazy and no unit test opens a connection. DB-backed tests are gated by
      # REQUIRE_TEST_DATABASE and run in the verify job.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sampling_vlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:unit:random
