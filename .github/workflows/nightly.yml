name: Nightly (slow / order-sensitive checks)

# These suites are valuable but flaky-prone (randomized order) or slow and
# browser-dependent. They are kept out of the blocking PR gate on purpose.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  randomized-unit:
    runs-on: ubuntu-latest
    env:
      # Present for src/db/index.ts; no unit test opens a connection.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sampling_vlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:unit:random

  teaching-flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sampling_vlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sampling_vlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sampling_vlab_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sampling_vlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed:demo
      - run: bun node_modules/agent-browser/bin/agent-browser.js install --with-deps
      - run: bun run test:teaching
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-flow
          path: test-results/teaching-flow/
          if-no-files-found: ignore
